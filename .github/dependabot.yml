version: 2
updates:
  - package-ecosystem: maven
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      javafx:
        patterns:
          - "org.openjfx*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
